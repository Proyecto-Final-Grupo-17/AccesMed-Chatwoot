# Chatwoot Community Edition (CE) con Docker (local en Windows y servidor Linux)
# Basado en referencia-oficial/docker-compose.production.yaml, con estos cambios:
#   - Imagen CE fijada a una version (v4.18.0-ce) en lugar de chatwoot:latest
#   - La contrasena de Postgres se toma del .env (una sola fuente de verdad)
#   - Postgres expuesto en 127.0.0.1:5433 (no choca con un Postgres local en 5432)
#   - Redis sin puerto publicado (solo lo usan los contenedores internamente)
#   - Puerto de la web configurable con CHATWOOT_PORT del .env (por defecto 3000;
#     en el servidor 3100, porque el 3000 es del front de prod de AccesMed)
name: chatwoot

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.18.0-ce
  env_file: .env
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *chatwoot
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:${CHATWOOT_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped

  sidekiq:
    <<: *chatwoot
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:

# Nginx del servidor: chat.accesmed.site -> Chatwoot (127.0.0.1:3100), con HTTPS.
#
# Certificado: Sectigo PositiveSSL comprado en DonWeb, emitido para chat.accesmed.site.
#   /etc/ssl/chat.accesmed.site/fullchain.crt  (certificado + intermedio)
#   /etc/ssl/chat.accesmed.site/privkey.key    (clave privada, chmod 600)
# Se instalan (y se renuevan) con scripts/instalar-certificado.sh.
#
# Instalar en el servidor (desde la carpeta del repo, con el certificado ya instalado):
#   cp deploy/nginx/chat.accesmed.site.conf /etc/nginx/sites-available/chat.accesmed.site
#   ln -sf /etc/nginx/sites-available/chat.accesmed.site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Configuracion de proxy basada en la guia oficial de Chatwoot (Docker + Nginx).

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chat.accesmed.site;
    return 301 https://chat.accesmed.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.accesmed.site;

    ssl_certificate     /etc/ssl/chat.accesmed.site/fullchain.crt;
    ssl_certificate_key /etc/ssl/chat.accesmed.site/privkey.key;

    # Chatwoot usa headers con guion bajo en la API; Nginx los descarta por defecto.
    underscores_in_headers on;

    # Adjuntos de las conversaciones: sin limite de tamano en el proxy.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_pass_header Authorization;

        # WebSockets (ActionCable): actualizaciones en vivo del panel.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 36000s;
        proxy_redirect off;
    }
}
